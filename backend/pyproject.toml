[project]
name = "prax-ai-voice-agent"
version = "1.0.0"
description = "PRAX AI Voice Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=43.0,<47.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<7.0",
    "langgraph>=1.0,<2.0",
    "google-genai>=2.10,<3.0",
    "supabase>=2.0,<3.0"
]

[tool.fastapi]
entrypoint = "app.main:app"